name: Deploy Jurnal IT Astro ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Mengambil kode dari repositori
        uses: actions/checkout@v4

      - name: Menyiapkan Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Menginstal Dependensi dari Lockfile
        run: npm ci

      - name: Pemeriksaan dan Build Astro
        run: npm run build

      - name: Mengunggah Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publikasi ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
