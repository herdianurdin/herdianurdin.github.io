name: Deploy Jurnal IT Astro ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mengambil kode dari repositori
        uses: actions/checkout@v7

      - name: Menyiapkan Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Menginstal Dependensi dari Lockfile
        run: npm ci

      - name: Pemeriksaan dan Build Astro
        run: npm run build

      - name: Mengunggah Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publikasi ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
